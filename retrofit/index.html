<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retrofit Helper</title>
<meta name="description" content="Unofficial step-by-step helper for contractors and assessors on home energy and healthy home repair programs. Guía paso a paso no oficial.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#053675;--orange:#F78D1B;--ink:#0F1B2D;--muted:#5B6678;--line:#E3E8F0;--bg:#F5F7FB;--surface:#fff;--soft:#EEF3FA;--ok:#137A43;--okbg:#E5F5EC;--bad:#B42318;--badbg:#FDECEA;--warnbg:#FFF4E5;--warn:#8A5200;--accent-ink:#0B4A9E;--c1:#0B6E99;--c2:#7A4BC4;--c3:#1E8A5A}
@media (prefers-color-scheme:dark){:root{--ink:#E8EEF7;--muted:#9AA7BA;--line:#25324A;--bg:#0B1220;--surface:#111A2B;--soft:#16223A;--okbg:#0F2E1E;--ok:#5FD08F;--badbg:#3A1513;--bad:#FF8A80;--warnbg:#3A2A10;--warn:#FFC266;--accent-ink:#8DB8FF;--c1:#4FB6E3;--c2:#B59AF0;--c3:#5FD08F}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.hwrap{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.hwrap b{font-size:18px}
.lang{margin-left:auto;display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#fff;font:600 13px Inter,sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
main{max-width:960px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:clamp(26px,5vw,34px);letter-spacing:-.02em;margin:0 0 4px;line-height:1.15}
h2{font-size:20px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:13px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
p{margin:0 0 10px}
.lede{color:var(--muted);margin:0 0 14px;max-width:680px}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:9px 14px;font-size:13.5px;margin:0 0 18px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:780px){.pick{grid-template-columns:1fr}}
.prog{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px}
.prog .ic{font-size:22px;line-height:1}
.prog b{font-size:17px}
.prog ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
.prog[aria-pressed="true"]{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 18%,transparent)}
.prog .go{margin-top:auto;font-weight:700;font-size:13.5px;color:var(--pc)}
.diff{border-left:5px solid var(--pc);background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.diff b{display:block;margin-bottom:4px}
.diff ul{margin:0;padding-left:18px}
.diff li{margin:3px 0}
.role{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-weight:700;font-size:14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px Inter,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.rail button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px Inter,sans-serif;padding:8px 12px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.rail button .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:12px;font-weight:800}
.rail button.done .n{background:var(--ok);color:#fff}
.rail button[aria-current="step"]{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc)}
.rail button[aria-current="step"] .n{background:var(--pc);color:#fff}
.stage{border:2px solid var(--pc);border-radius:18px;padding:18px 20px;background:var(--surface);margin-bottom:14px;scroll-margin-top:70px}
.stage .top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.stage .top .n{width:34px;height:34px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.stage .top h2{margin:0;font-size:22px}
.whobar{color:var(--muted);font-size:14px;margin:2px 0 8px}
.plain{font-size:16px;margin:6px 0 12px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15.5px}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--navy);flex:none}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.tag.a{background:color-mix(in srgb,var(--c1) 15%,transparent);color:var(--c1)}
.tag.c{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--warn)}
.tag.o{background:var(--soft);color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.box{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14.5px}
.box b{display:block;margin-bottom:4px;font-size:14px}
.box ul{margin:0;padding-left:18px}
.warnbox{margin-top:12px;background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14.5px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;font:700 15px Inter,sans-serif;padding:11px 18px;border-radius:12px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent-ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.tool{margin-top:14px;border:1px dashed var(--line);border-radius:14px;padding:14px}
.tool h4{margin:0 0 8px;font-size:15px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.fields{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
input[type=number]{font:500 15px Inter,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.result{margin-top:10px;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14.5px;background:var(--soft)}
.result.ok{background:var(--okbg);color:var(--ok)}.result.bad{background:var(--badbg);color:var(--bad)}.result.warn{background:var(--warnbg);color:var(--warn)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 20px;margin-bottom:14px}
details.more summary{cursor:pointer;font-weight:800;font-size:17px}
.links{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.links a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-weight:600}
.links a small{display:block;font-weight:500;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.fact{background:var(--soft);border-radius:12px;padding:10px 12px}
.fact span{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fact b{font-size:15px}
.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl td:first-child{font-weight:700;width:22%}
@media(max-width:700px){.tbl thead{display:none}.tbl tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}.tbl td{display:block;border:0;padding:3px 0;width:auto!important}.tbl td[data-h]::before{content:attr(data-h)": ";font-weight:700;color:var(--muted)}}
.empty{color:var(--muted);text-align:center;padding:26px 10px;border:2px dashed var(--line);border-radius:16px}
footer{max-width:960px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer .btn{font-size:13px;padding:7px 12px}
@media print{header,.pick,.role,.rail,.nav,footer .btn{display:none}details.more{display:block}}
</style>
</head>
<body>
<header><div class="hwrap"><b data-t="title"></b>
  <div class="lang" role="group" aria-label="Language / Idioma"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="es" aria-pressed="false">ES</button></div>
</div></header>

<main>
  <h1 data-t="title"></h1>
  <p class="lede" data-t="lede"></p>
  <p class="note" data-t="disclaimer"></p>

  <h2 data-t="pickH"></h2>
  <div class="pick" id="pick"></div>
  <p style="margin:-6px 0 18px"><a href="#cmp" id="cmpLink" data-t="cmpLink"></a></p>

  <div id="view"></div>

  <details class="more" id="cmp">
    <summary data-t="cmpH"></summary>
    <table class="tbl" id="cmpTbl"></table>
  </details>

  <details class="more" id="anyc">
    <summary data-t="anyH"></summary>
    <ul class="links" id="anyLinks"></ul>
  </details>
</main>
<footer><span data-t="foot"></span><button class="btn ghost" type="button" id="reset" data-t="reset"></button><button class="btn ghost" type="button" id="printBtn" data-t="print"></button></footer>

 h+='<div class="two"><div class="box"><b>'+esc(L(T.needH))+'</b><ul>'+st.n.map(function(n){return "<li>"+esc(L(n))+"</li>";}).join("")+'</ul></div><div class="box"><b>'+esc(L(T.nextH))+'</b>'+esc(L(st.x))+'</div></div>';
 if(st.w)h+='<div class="warnbox">⚠ '+esc(L(st.w))+'</div>';
 h+='<div class="nav"><button type="button" class="btn ghost" data-go="'+(i-1)+'"'+(i===0?" disabled":"")+'>'+esc(L(T.back))+'</button>';
 h+=i<p.steps.length-1?'<button type="button" class="btn" data-go="'+(i+1)+'">'+esc(L(T.next))+'</button>':'<span class="result ok" style="margin:0">'+esc(L(T.finish))+'</span>';
 h+='</div></section>';
 h+='<details class="more"><summary>'+esc(L(T.factsH))+'</summary><div class="facts">'+p.facts.map(function(f){return '<div class="fact"><span>'+esc(L(f[0]))+'</span><b>'+esc(L(f[1]))+'</b></div>';}).join("")+'</div></details>';
 h+='<details class="more"><summary>'+esc(L(T.linksH))+'</summary><ul class="links">'+linkList(p.links)+'</ul></details>';
 h+='</div>';
 view.innerHTML=h; wireTool(st.tool);
 var ac=view.querySelector('.rail [aria-current="step"]'),rl=view.querySelector(".rail");if(ac&&rl)rl.scrollLeft=Math.max(0,ac.offsetLeft-rl.offsetLeft-16);
}
function linkList(a){return a.map(function(l){return '<li><a href="'+l[0]+'" target="_blank" rel="noopener">'+esc(L(l[1]))+'<small>'+esc(l[2])+'</small></a></li>';}).join("");}

var GATE={gate:[["QA approved the scope in writing","QA aprobó el alcance por escrito"],["Homeowner signed for this exact scope","El dueño firmó este alcance exacto"],["Price agreed in writing","Precio acordado por escrito"],["Permits pulled","Permisos sacados"],["You and your subs are approved and current (CCB, insurance, training)","Usted y sus subcontratistas están aprobados y al día (CCB, seguro, capacitación)"]],
 paper:[["Model and size on the invoice match the AHRI certificate","Modelo y tamaño en la factura coinciden con el AHRI"],["Completion form matches the invoice (what was replaced, what was installed)","El formulario final coincide con la factura (lo reemplazado, lo instalado)"],["Co-funding listed on the invoice","Otros fondos anotados en la factura"],["Homeowner's signed page included","Página firmada del dueño incluida"],["Before and after photos included","Fotos antes y después incluidas"],["Going in before the deadline","Se entrega antes del plazo"]]};

function toolHTML(t){
 var es=lang==="es";
 if(t==="scope")return '<div class="tool"><h4>'+(es?"Revise su alcance":"Check your scope")+'</h4><div class="fields"><label class="f">'+(es?"Ahorro modelado (%)":"Modeled savings (%)")+'<input type="number" id="sv" min="0" step="0.1" inputmode="decimal"></label><label class="f">'+(es?"Reparaciones ($)":"Repairs ($)")+'<input type="number" id="rp" min="0" inputmode="decimal"></label><label class="f">'+(es?"Trabajo de energía ($)":"Energy work ($)")+'<input type="number" id="en" min="0" inputmode="decimal"></label></div><div class="result" id="tout">'+(es?"Escriba los números de su modelo y estimado.":"Type the numbers from your model and estimate.")+'</div></div>';
 if(t==="budget")return '<div class="tool"><h4>'+(es?"Revise su cotización por categoría":"Check your bid by category")+'</h4><div class="fields"><label class="f">'+(es?"Accesibilidad ($)":"Accessibility ($)")+'<input type="number" id="bA" min="0" inputmode="decimal"></label><label class="f">'+(es?"Pre-climatización ($)":"Pre-weatherization ($)")+'<input type="number" id="bP" min="0" inputmode="decimal"></label><label class="f">'+(es?"Climatización ($)":"Weatherization ($)")+'<input type="number" id="bW" min="0" inputmode="decimal"></label></div><div class="result" id="tout">'+(es?"Escriba los totales por categoría.":"Type your totals by category.")+'</div></div>';
 if(GATE[t]){
  var h='<div class="tool"><h4>'+(t==="gate"?(es?"¿Listo para instalar?":"Ready to install?"):(es?"¿Listo para entregar?":"Ready to submit?"))+'</h4><ul class="checks">';
  GATE[t].forEach(function(g,j){var id="rh2-"+t+"-"+j;h+='<li><label><input type="checkbox" data-k="'+id+'" data-tool="'+t+'"'+(S(id)==="1"?" checked":"")+'><span>'+esc(L(g))+'</span></label></li>';});
  return h+'</ul><div class="result" id="tout"></div></div>';
 }
 return "";
}
function num(id){var e=document.getElementById(id);if(!e)return null;var v=parseFloat(e.value);return isNaN(v)?null:v;}
function money(v){return "$"+Math.round(v).toLocaleString("en-US");}
function wireTool(t){
 var o=document.getElementById("tout"); if(!o)return; var es=lang==="es";
 if(t==="scope"){var f=function(){var sv=num("sv"),rp=num("rp"),en=num("en"),m=[],bad=false,warn=false;if(sv===null&&rp===null&&en===null)return;
  if(sv!==null){if(sv>=10)m.push(es?"✓ "+sv+"% de ahorro: cumple el 10%":"✓ "+sv+"% savings: meets the 10%");else{bad=true;m.push(es?"✕ "+sv+"%: necesita 10% o más. Agregue medidas que ahorren más (sellado de aire, aislamiento, bomba de calor).":"✕ "+sv+"%: needs 10% or more. Add bigger-savings measures (air sealing, insulation, heat pump).");}}
  if(rp!==null&&en!==null&&rp+en>0){var pc=Math.round(rp/(rp+en)*1000)/10;if(pc<=30)m.push(es?"✓ Reparaciones: "+pc+"% del total":"✓ Repairs are "+pc+"% of the total");else if(pc<=40){warn=true;m.push(es?"! Reparaciones "+pc+"%: bajo el 40%, pero vigile que el 70% vaya a energía en total":"! Repairs "+pc+"%: under 40%, but watch the 70%-to-energy rule overall");}else{bad=true;m.push(es?"✕ Reparaciones "+pc+"%: más del 40% permitido":"✕ Repairs "+pc+"%: over the 40% limit");}}
  o.className="result "+(bad?"bad":warn?"warn":"ok");o.innerHTML=m.map(esc).join("<br>");};
  ["sv","rp","en"].forEach(function(id){document.getElementById(id).addEventListener("input",f);});}
 if(t==="budget"){var g=function(){var a=num("bA"),p=num("bP"),w=num("bW"),m=[],bad=false;if(a===null&&p===null&&w===null)return;
  [[a,2000,"Accessibility","Accesibilidad"],[p,15000,"Pre-weatherization","Pre-climatización"],[w,5000,"Weatherization","Climatización"]].forEach(function(r){if(r[0]===null)return;if(r[0]>r[1]){bad=true;m.push("✕ "+(es?r[3]:r[2])+" "+money(r[0])+(es?" pasa el límite usual de ":" is over the usual limit of ")+money(r[1]));}else m.push("✓ "+(es?r[3]:r[2])+" "+money(r[0]));});
  var tt=(a||0)+(p||0)+(w||0);m.push("Total: "+money(tt)+(es?" (máximo usual por casa: $22,000 de trabajo + $750 de evaluación)":" (usual max per home: $22,000 of work + $750 assessment)"));if(tt>22000)bad=true;
  o.className="result "+(bad?"bad":"ok");o.innerHTML=m.map(esc).join("<br>");};
  ["bA","bP","bW"].forEach(function(id){document.getElementById(id).addEventListener("input",g);});}
 if(GATE[t])gate(t);
}
function gate(t){var o=document.getElementById("tout");if(!o)return;var all=true,es=lang==="es";GATE[t].forEach(function(_,j){if(S("rh2-"+t+"-"+j)!=="1")all=false;});
 o.className="result "+(all?"ok":"bad");o.textContent=t==="gate"?(all?(es?"✓ Listo para instalar":"✓ Ready to install"):(es?"✕ Todavía no instale":"✕ Not ready to install yet")):(all?(es?"✓ Listo para entregar":"✓ Ready to submit"):(es?"✕ Arregle lo que falta antes de entregar":"✕ Fix what's missing before you submit"));}

function renderCmp(){
 var h='<thead><tr><th></th>'+KEYS.map(function(k){return "<th>"+esc(L(P[k].name))+"</th>";}).join("")+'</tr></thead><tbody>';
 CMP.forEach(function(r){h+='<tr><td>'+esc(L(r[0]))+'</td>'+[1,2,3].map(function(c){return '<td data-h="'+esc(L(P[KEYS[c-1]].name))+'">'+esc(L(r[c]))+'</td>';}).join("")+'</tr>';});
 document.getElementById("cmpTbl").innerHTML=h+'</tbody>';
 document.getElementById("anyLinks").innerHTML=linkList(ANY);
}
function applyLang(){
 document.documentElement.lang=lang;
 Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(el){var p=T[el.getAttribute("data-t")];if(p)el.textContent=L(p);});
 Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lang")===lang?"true":"false");});
 renderPick();renderView();renderCmp();
}
function scrollTo(el){if(el&&el.scrollIntoView)el.scrollIntoView({behavior:"smooth",block:"start"});}

document.addEventListener("click",function(e){
 var b=e.target.closest("button,a");if(!b)return;
 if(b.hasAttribute("data-prog")){cur=b.getAttribute("data-prog");S("rh2-prog",cur);try{history.replaceState(null,"","#"+cur);}catch(x){}renderPick();renderView();scrollTo(view);}
 else if(b.hasAttribute("data-role")){role=b.getAttribute("data-role");S("rh2-role",role);renderView();}
 else if(b.hasAttribute("data-go")){var g=+b.getAttribute("data-go");if(cur&&g>=0&&g<P[cur].steps.length){S("rh2-step-"+cur,String(g));renderView();if(b.closest(".nav"))scrollTo(document.getElementById("stage"));}}
 else if(b.hasAttribute("data-lang")){lang=b.getAttribute("data-lang");S("rh2-lang",lang);applyLang();}
 else if(b.id==="cmpLink"){e.preventDefault();var c=document.getElementById("cmp");c.open=true;scrollTo(c);}
 else if(b.id==="printBtn"){window.print();}
 else if(b.id==="reset"){if(!window.confirm(lang==="es"?"¿Borrar todas sus marcas en este dispositivo?":"Clear all your checkmarks on this device?"))return;try{Object.keys(localStorage).forEach(function(k){if(k.indexOf("rh2-")===0&&["rh2-lang","rh2-prog","rh2-role"].indexOf(k)<0)localStorage.removeItem(k);});}catch(x){}renderView();}
});
document.addEventListener("change",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-k");if(!k)return;S(k,e.target.checked?"1":"0");
 var t=e.target.getAttribute("data-tool");if(t){gate(t);return;}
 var rail=document.querySelectorAll(".rail button");if(rail.length&&cur){var i=stepIdx(cur),btn=rail[i],d=stepDone(cur,i);btn.classList.toggle("done",d);btn.querySelector(".n").textContent=d?"✓":String(i+1);}});

var sl=S("rh2-lang");if(sl==="es"||sl==="en")lang=sl;else if((navigator.language||"").toLowerCase().indexOf("es")===0)lang="es";
var hsh=(location.hash||"").replace("#","");if(P[hsh])cur=hsh;
if(["a","c","b"].indexOf(role)<0)role="b";
applyLang();
})();
</script>
