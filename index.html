<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Latino Built Playbook</title>
<style>
:root{--navy:#053675;--orange:#F78D1B;--bg:#F4F6FA;--card:#fff;--ink:#0F1B33;--muted:#56637C;--line:#DCE2EC;--err:#B42318}
@media (prefers-color-scheme:dark){:root{--bg:#0A1322;--card:#111D31;--ink:#E7ECF5;--muted:#9BA7BE;--line:#22314B;--err:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.top{background:var(--navy);color:#fff;padding:22px 24px;border-bottom:4px solid var(--orange)}
.word{font:900 24px/1 "Arial Narrow",Arial,sans-serif;letter-spacing:.02em;text-transform:uppercase}
.word b{color:var(--orange)}
.sub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-top:6px}
form{padding:24px;display:grid;gap:14px}
label{font-weight:700;font-size:14px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:700;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.5em;font-size:14px;color:var(--err);margin:0}
.es{font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="card">
  <div class="top"><div class="word">Latino<b>Built</b></div><div class="sub">Team Playbook · Staff only</div></div>
  <form id="f">
    <label for="pw">Team password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <label class="row"><input id="rem" type="checkbox" checked> Remember me on this device</label>
    <button id="go" type="submit">Open playbook</button>
    <p class="msg" id="msg" role="alert"></p>
    <p class="es">Solo para el equipo de Latino Built. Pida la contraseña a su supervisor.</p>
  </form>
</div>

const K="lb-playbook-key";
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.salt),iterations:D.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function open(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.iv)},key,u(D.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
(async()=>{ // remembered key
  try{const j=localStorage.getItem(K); if(!j) return;
    const key=await crypto.subtle.importKey("jwk",JSON.parse(j),{name:"AES-GCM"},true,["decrypt"]);
    await open(key);
  }catch(e){try{localStorage.removeItem(K)}catch(_){}}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const b=document.getElementById("go"),m=document.getElementById("msg");
  b.disabled=true;b.textContent="Checking...";m.textContent="";
  try{
    const key=await derive(document.getElementById("pw").value);
    if(document.getElementById("rem").checked){
      try{localStorage.setItem(K,JSON.stringify(await crypto.subtle.exportKey("jwk",key)))}catch(_){}
    }
    await open(key);
  }catch(err){
    m.textContent="That password didn't work. Check it and try again.";
    b.disabled=false;b.textContent="Open playbook";
  }
});
