name: Health check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check what the public (not signed in) can see
        run: |
          URL=$(grep -oE 'url: *"[^"]+"' bids/config.js | cut -d'"' -f2)
          KEY=$(grep -oE 'anonKey: *"[^"]+"' bids/config.js | cut -d'"' -f2)
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "== auth settings"; curl -s "$URL/auth/v1/settings" "${H[@]}" | python3 -c "import sys,json;d=json.load(sys.stdin);print('signups disabled:',d.get('disable_signup'),'| auto-confirm:',d.get('mailer_autoconfirm'),'| email login:',d.get('external',{}).get('email'))"
          for t in bid_jobs bid_job_private bid_submissions bid_staff bid_settings team_posts team_polls team_votes team_scores team_secret team_member team_vault; do
            R=$(curl -s -w ' HTTP%{http_code}' "$URL/rest/v1/$t?select=*&limit=3" "${H[@]}")
            echo "TABLE $t -> ${R:0:300}"
          done
          for f in team_page_key team_whoami is_bid_staff; do
            echo "RPC $f -> $(curl -s -w ' HTTP%{http_code}' -X POST "$URL/rest/v1/rpc/$f" "${H[@]}" -H 'Content-Type: application/json' -d '{}' | head -c 250)"; done
          echo "RPC team_feed -> $(curl -s -w ' HTTP%{http_code}' -X POST "$URL/rest/v1/rpc/team_feed" "${H[@]}" -H 'Content-Type: application/json' -d '{"tok":"x"}' | head -c 250)"
          echo "RPC team_ok -> $(curl -s -w ' HTTP%{http_code}' -X POST "$URL/rest/v1/rpc/team_ok" "${H[@]}" -H 'Content-Type: application/json' -d '{"tok":"x"}' | head -c 250)"
          echo "RPC team_post -> $(curl -s -w ' HTTP%{http_code}' -X POST "$URL/rest/v1/rpc/team_post" "${H[@]}" -H 'Content-Type: application/json' -d '{"tok":"x","p":{"author":"Hacker","body":"hi"}}' | head -c 250)"
          echo "RPC get_bid -> $(curl -s -w ' HTTP%{http_code}' -X POST "$URL/rest/v1/rpc/get_bid" "${H[@]}" -H 'Content-Type: application/json' -d '{"p_token":"00000000-0000-0000-0000-000000000000"}' | head -c 250)"
          echo "STORAGE public read -> $(curl -s -w ' HTTP%{http_code}' "$URL/storage/v1/object/public/bid-files/test.txt" | head -c 200)"
          echo "STORAGE list -> $(curl -s -w ' HTTP%{http_code}' -X POST "$URL/storage/v1/object/list/bid-files" "${H[@]}" -H 'Content-Type: application/json' -d '{"prefix":"","limit":5}' | head -c 250)"
      - name: Live website
        run: |
          for u in https://aaronoso08.github.io/LB-Playbook/ https://aaronoso08.github.io/LB-Playbook/bids/ https://aaronoso08.github.io/LB-Playbook/sw.js https://aaronoso08.github.io/LB-Playbook/manifest.json https://aaronoso08.github.io/LB-Playbook/bids/config.js https://aaronoso08.github.io/ProSource/ https://latinobuilt.org/wp-content/uploads/2026/08/AaronHeadshot_Website-300x300.jpg https://latinobuilt.org/wp-content/uploads/2026/08/CristianHeadshot_Website-300x300.jpg https://latinobuilt.org/wp-content/uploads/2026/08/JoseHeadshot_Website-1-300x300.jpg; do
            echo "$(curl -s -o /dev/null -w '%{http_code} %{size_download}b' "$u") $u"; done
          curl -s https://aaronoso08.github.io/LB-Playbook/ | grep -c 'Work email' | sed 's/^/live page has email sign-in: /'
